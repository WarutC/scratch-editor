# nginx-level add_header inherits to a `location` block ONLY if that block has
# no add_header of its own (long-standing nginx gotcha). We therefore declare
# the security headers via a re-usable map+block trick: every location that
# adds *any* header repeats the security trio explicitly.

server {
    listen       8080 default_server;
    server_name  _;
    server_tokens off;

    root   /usr/share/nginx/html;
    index  index.html;

    # Server-level defaults (apply to any location with NO add_header of its own)
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "frame-ancestors 'none'" always;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types text/plain text/css text/javascript application/javascript application/json image/svg+xml;

    location /chunks/ {
        # No location-level add_header → server-level security headers inherit.
        # Cache-Control needs to be here; once added, security headers stop
        # inheriting, so we re-declare them.
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Content-Security-Policy "frame-ancestors 'none'" always;
        add_header Cache-Control "public, immutable" always;
        expires 1y;
    }
    location /static/ {
        # /static/ mixes content-hashed files with stable-name ones (favicon.ico,
        # blocks-media). Drop `immutable` — let mtime validation refresh on deploys.
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Content-Security-Policy "frame-ancestors 'none'" always;
        add_header Cache-Control "public" always;
        expires 1y;
    }

    location = /index.html {
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Content-Security-Policy "frame-ancestors 'none'" always;
        add_header Cache-Control "no-store" always;
    }

    location = /env-config.js {
        # Rendered at container start by /docker-entrypoint.d/30-spark-env.sh
        # into /tmp/env-config.js. Keeps the html root mountable as readOnly.
        alias /tmp/env-config.js;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Content-Security-Policy "frame-ancestors 'none'" always;
        add_header Cache-Control "no-store" always;
        default_type application/javascript;
    }

    location = /healthz {
        access_log off;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Content-Security-Policy "frame-ancestors 'none'" always;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Firmware update channel, mounted from the host (filled by the spark-firmware-releases publish-site
    # workflow). The manifest is always revalidated so clients see new releases promptly; a versioned .bin never
    # changes. Missing files are a 404, never the Scratch page. Security-header trio re-declared in every block
    # (nginx add_header inheritance gotcha — see top).
    location = /firmware/manifest.json {
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Content-Security-Policy "frame-ancestors 'none'" always;
        add_header Cache-Control "no-cache" always;
        default_type application/json;
        try_files $uri =404;
    }
    location /firmware/ {
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Content-Security-Policy "frame-ancestors 'none'" always;
        add_header Cache-Control "public, immutable" always;
        expires 1y;
        default_type application/octet-stream;
        try_files $uri =404;
    }

    # Download page (https://sparky.ntpsemi.com/releases/), mounted from the host like /firmware/. The page and
    # releases.json are revalidated on every visit; installers live under a per-version path and never change.
    location ~ ^/releases/(index\.html|releases\.json)?$ {
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Content-Security-Policy "frame-ancestors 'none'" always;
        add_header Cache-Control "no-cache" always;
        try_files $uri $uri/index.html =404;
    }
    location /releases/files/ {
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Content-Security-Policy "frame-ancestors 'none'" always;
        add_header Cache-Control "public, immutable" always;
        expires 1y;
        default_type application/octet-stream;
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
